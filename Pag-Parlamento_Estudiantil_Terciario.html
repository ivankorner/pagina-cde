<style>
  /* =========================================================
     Scope: .cde-pet — no choca con estilos del tema ni Elementor.
     ========================================================= */
  .cde-pet__page {
    --text: #1a1a1a;
    background:
      radial-gradient(
        circle at 10% 20%,
        rgba(30, 94, 176, 0.14),
        transparent 25%
      ),
      radial-gradient(
        circle at 90% 80%,
        rgba(77, 163, 255, 0.16),
        transparent 25%
      ),
      #f5f9ff;
    color: var(--text);
  }

  .cde-pet,
  .cde-pet *,
  .cde-pet *::before,
  .cde-pet *::after { box-sizing: border-box; }

  .cde-pet {
    --cde-pet-blue: #15427d;
    --cde-pet-blue-dark: #0e2f5c;
    --cde-pet-gold: #1e5eb0;
    --cde-pet-gold-light: #4da3ff;
    --cde-pet-accent: #1e5eb0;
    --cde-pet-accent-dark: #15427d;
    --cde-pet-accent-border: #c9ddf5;
    --cde-pet-white: #ffffff;
    --cde-pet-gray-50: #f5f9ff;
    --cde-pet-gray-100: #eef4fc;
    --cde-pet-gray-200: #d7deea;
    --cde-pet-gray-600: #526273;

    --cde-pet-shadow-lg: 0 4px 20px rgba(0,0,0,0.1), 0 8px 32px rgba(0,0,0,0.06);

    color: #1a1a1a;

  }

  .cde-pet a { text-decoration: none; }

  .cde-pet__page-title {
    font-family: Georgia, "Times New Roman", serif;

  .cde-pet .cde-home__post--featured { grid-column: 1 / -1; display: grid; grid-template-columns: 1.08fr 1fr; }

  .cde-pet .cde-home__post--featured .cde-home__post-thumb img { position: absolute; inset: 0; }
  .cde-pet .cde-home__post:hover .cde-home__post-thumb img { transform: scale(1.06); }

  .cde-pet .cde-home__chip {

  .cde-pet .cde-home__chip--gold { background: var(--cde-pet-accent); color: var(--cde-pet-white); }

  .cde-pet .cde-home__post-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }

  .cde-pet .cde-home__post-date {

  .cde-pet .cde-home__post-title a { color: inherit; transition: color var(--cde-pet-transition); }
  .cde-pet .cde-home__post:hover .cde-home__post-title a { color: var(--cde-pet-blue-dark); }

  .cde-pet .cde-home__post--featured .cde-home__post-title {
    font-size: clamp(1.25rem, 2vw, 1.55rem);

    -webkit-line-clamp: 4;

  .cde-pet .cde-home__post-excerpt {
    margin: 0;
    font-size: 0.94rem;
    color: var(--cde-pet-gray-600);

    -webkit-line-clamp: 3;

  .cde-pet .cde-home__post--featured .cde-home__post-excerpt { -webkit-line-clamp: 5; font-size: 1rem; }

  .cde-pet .cde-home__post-foot {

  .cde-pet .cde-home__post-more:hover { color: var(--cde-pet-accent-dark); }
  .cde-pet .cde-home__post-more:hover .material-symbols-outlined { transform: translateX(4px); }

  .cde-pet .cde-home__post--small .cde-home__post-more { margin-top: auto; }

  .cde-pet__loading {
    text-align: center;

  .cde-pet__loading p { margin-top: 16px; }
  .cde-pet__spinner {
    width: 36px;

  @keyframes cde-pet-spin { to { transform: rotate(360deg); } }

  .cde-pet__empty {

  .cde-pet__empty .material-symbols-outlined {

  .cde-pet__empty p {

  .cde-pet__error {

  .cde-pet__pagination {

  .cde-pet__pagination:empty { display: none; }

  .cde-pet__page-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    padding: 0 12px;

    border-radius: var(--cde-pet-radius);

  .cde-pet__page-btn:hover:not(.cde-pet__page-btn--active):not(:disabled) {

  }
  .cde-pet__page-btn--active {

  @media (max-width: 900px) {

  @media (max-width: 768px) {

  }

  @media (max-width: 640px) {

  @media (prefers-reduced-motion: reduce) {

    .cde-pet .cde-home__post:hover .cde-home__post-thumb img { transform: none; }

</style>

  .cde-pet .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 20;

    user-select: none;

<script>
(function() {
  /* =========================================================
     CONFIGURACIÓN — Cambiar slug para cada post type.
     ========================================================= */
  var POST_TYPE_CONFIG = {
    slug: 'parlamento-terciario',
    perPage: 9,
    apiBase: 'https://cdeldorado.gob.ar/wp-json/wp/v2/'
  };

  var CHIP_LABEL = 'Parlamento Estudiantil Terciario';
  var currentPage = 1;
  var totalPages = 1;

  var grid = document.getElementById('cde-pet-grid');
  var loading = document.getElementById('cde-pet-loading');
  var empty = document.getElementById('cde-pet-empty');
  var pagination = document.getElementById('cde-pet-pagination');

  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function stripHtml(html) {
    var tmp = document.createElement('div');
    tmp.innerHTML = html || '';
    return (tmp.textContent || tmp.innerText || '').replace(/\s*\[\.\.\.\]\s*$/, '').replace(/\s+/g, ' ').trim();
  }

  function formatDate(dateStr) {
    try {
      return new Intl.DateTimeFormat('es-AR', { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(dateStr));
    } catch (e) {
      return String(dateStr || '').slice(0, 10);
    }
  }

  function truncate(text, max) {
    if (!text || text.length <= max) return text || '';
    var cut = text.slice(0, max);
    cut = cut.slice(0, Math.max(cut.lastIndexOf(' '), 0));
    return cut + '…';
  }

  function getExcerpt(post) {
    var text = '';
    if (post.excerpt && post.excerpt.rendered) text = stripHtml(post.excerpt.rendered);
    if (!text && post.content && post.content.rendered) text = stripHtml(post.content.rendered);
    return text || 'Lea la nota completa en el sitio oficial del Concejo Deliberante de Eldorado.';
  }

  function getThumbSrc(post) {
    if (post._embedded && post._embedded['wp:featuredmedia'] && post._embedded['wp:featuredmedia'][0]) {
      var media = post._embedded['wp:featuredmedia'][0];
      if (media.media_details && media.media_details.sizes && media.media_details.sizes.medium_large) {
        return media.media_details.sizes.medium_large.source_url;
      }
      if (media.media_details && media.media_details.sizes && media.media_details.sizes.large) {
        return media.media_details.sizes.large.source_url;
      }
      if (media.media_details && media.media_details.sizes && media.media_details.sizes.medium) {
        return media.media_details.sizes.medium.source_url;
      }
      return media.source_url || '';
    }
    return '';
  }

  function cleanTitle(post) {
    return stripHtml(post.title && post.title.rendered);
  }

  function cardDate(iso) {
    return '<span class="cde-home__post-date"><span class="material-symbols-outlined" aria-hidden="true">calendar_month</span>' + esc(formatDate(iso)) + '</span>';
  }

  function moreLink(href) {
    return '<a class="cde-home__post-more" href="' + esc(href) + '">Saber más<span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span></a>';
  }

  function thumbHtml(post, title) {
    var src = getThumbSrc(post);
    if (!src) return '';
    return '<img src="' + esc(src) + '" alt="' + esc(title) + '" loading="lazy" decoding="async">';
  }

  function featuredCard(post, isLatest) {
    var link = esc(post.link);
    var title = esc(cleanTitle(post));
    var tags = '<div class="cde-home__post-tags">';
    if (isLatest) tags += '<span class="cde-home__chip cde-home__chip--gold">Más reciente</span>';
    tags += '<span class="cde-home__chip cde-home__chip--soft">' + esc(CHIP_LABEL) + '</span></div>';
    return '<article class="cde-home__post cde-home__post--featured">' +
      '<a class="cde-home__post-thumb" href="' + link + '" tabindex="-1" aria-hidden="true">' +
      thumbHtml(post, title) + '</a>' +
      '<div class="cde-home__post-body">' +
      tags +
      '<h3 class="cde-home__post-title"><a href="' + link + '">' + title + '</a></h3>' +
      '<p class="cde-home__post-excerpt">' + esc(getExcerpt(post)) + '</p>' +
      '<div class="cde-home__post-foot">' + cardDate(post.date) + moreLink(post.link) + '</div>' +
      '</div></article>';
  }

  function smallCard(post) {
    var link = esc(post.link);
    var title = esc(cleanTitle(post));
    return '<article class="cde-home__post cde-home__post--small">' +
      '<a class="cde-home__post-thumb" href="' + link + '" tabindex="-1" aria-hidden="true">' +
      '<span class="cde-home__chip cde-home__chip--img">' + esc(CHIP_LABEL) + '</span>' +
      thumbHtml(post, title) + '</a>' +
      '<div class="cde-home__post-body">' +
      cardDate(post.date) +
      '<h3 class="cde-home__post-title"><a href="' + link + '">' + title + '</a></h3>' +
      '<p class="cde-home__post-excerpt">' + esc(truncate(getExcerpt(post), 150)) + '</p>' +
      moreLink(post.link) +
      '</div></article>';
  }

  function renderCards(posts) {
    if (!posts || posts.length === 0) {
      grid.innerHTML = '';
      loading.style.display = 'none';
      empty.style.display = '';
      pagination.innerHTML = '';
      return;
    }

    loading.style.display = 'none';
    empty.style.display = 'none';

    var html = featuredCard(posts[0], currentPage === 1);
    for (var i = 1; i < posts.length; i++) {
      html += smallCard(posts[i]);
    }

    grid.innerHTML = html;
    renderPagination();
  }

  function renderPagination() {
    if (totalPages <= 1) {
      pagination.innerHTML = '';
      return;
    }

    var html = '';

    html += '<button class="cde-pet__page-btn" data-page="1" ' + (currentPage === 1 ? 'disabled' : '') + ' title="Primera página">'
      + '<span class="material-symbols-outlined">first_page</span>'
      + '</button>';

    html += '<button class="cde-pet__page-btn" data-page="' + (currentPage - 1) + '" ' + (currentPage === 1 ? 'disabled' : '') + ' title="Página anterior">'
      + '<span class="material-symbols-outlined">chevron_left</span>'
      + '</button>';

    var range = getPageRange(currentPage, totalPages);
    for (var i = 0; i < range.length; i++) {
      if (range[i] === '...') {
        html += '<span class="cde-pet__page-ellipsis">…</span>';
      } else {
        var isActive = range[i] === currentPage;
        html += '<button class="cde-pet__page-btn' + (isActive ? ' cde-pet__page-btn--active' : '') + '" data-page="' + range[i] + '"' + (isActive ? ' disabled' : '') + '>' + range[i] + '</button>';
      }
    }

    html += '<button class="cde-pet__page-btn" data-page="' + (currentPage + 1) + '" ' + (currentPage === totalPages ? 'disabled' : '') + ' title="Página siguiente">'
      + '<span class="material-symbols-outlined">chevron_right</span>'
      + '</button>';

    html += '<button class="cde-pet__page-btn" data-page="' + totalPages + '" ' + (currentPage === totalPages ? 'disabled' : '') + ' title="Última página">'
      + '<span class="material-symbols-outlined">last_page</span>'
      + '</button>';

    pagination.innerHTML = html;
  }

  function getPageRange(current, total) {
    if (total <= 7) {
      var arr = [];
      for (var i = 1; i <= total; i++) arr.push(i);
      return arr;
    }
    var pages = [];
    if (current <= 4) {
      for (var i = 1; i <= 5; i++) pages.push(i);
      pages.push('...');
      pages.push(total);
    } else if (current >= total - 3) {
      pages.push(1);
      pages.push('...');
      for (var i = total - 4; i <= total; i++) pages.push(i);
    } else {
      pages.push(1);
      pages.push('...');
      pages.push(current - 1);
      pages.push(current);
      pages.push(current + 1);
      pages.push('...');
      pages.push(total);
    }
    return pages;
  }

  function loadPosts(page) {
    currentPage = page;
    loading.style.display = '';
    grid.innerHTML = '';
    empty.style.display = 'none';
    pagination.innerHTML = '';

    var url = POST_TYPE_CONFIG.apiBase + POST_TYPE_CONFIG.slug
      + '?per_page=' + POST_TYPE_CONFIG.perPage
      + '&page=' + page
      + '&_embed=wp:featuredmedia'
      + '&orderby=date&order=desc';

    fetch(url)
      .then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        totalPages = parseInt(res.headers.get('X-WP-TotalPages'), 10) || 1;
        return res.json();
      })
      .then(function(posts) {
        renderCards(posts);
        var root = document.getElementById('cde-pet-root');
        if (root && page > 1) {
          root.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      })
      .catch(function(err) {
        loading.style.display = 'none';
        grid.innerHTML = '';
        empty.style.display = 'none';
        pagination.innerHTML = '';
        var errDiv = document.createElement('div');
        errDiv.className = 'cde-pet__error';
        errDiv.innerHTML = '<p>Error al cargar las publicaciones. Verificá la consola del navegador o intentá nuevamente más tarde.</p>';
        document.getElementById('cde-pet-root').appendChild(errDiv);
        console.error('[cde-pet] Error:', err);
      });
  }

  pagination.addEventListener('click', function(e) {
    var btn = e.target.closest('.cde-pet__page-btn');
    if (!btn || btn.disabled) return;
    var page = parseInt(btn.getAttribute('data-page'), 10);
    if (page && page !== currentPage) {
      loadPosts(page);
    }
  });

  loadPosts(1);
})();
</script>
