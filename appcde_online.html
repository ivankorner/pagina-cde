<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Concejo Deliberante de Eldorado — Sitio en Desarrollo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <style>
    :root {
      --cde-blue: #1e3a5f;
      --cde-blue-dark: #152c4a;
      --cde-gold: #c9a227;
      --cde-gold-light: #d4b445;
      --cde-white: #ffffff;
      --cde-transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2e4f7a 0%, var(--cde-blue) 45%, #0e2038 100%);
      color: var(--cde-white);
      padding: 24px;
    }

    .cde-landing {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .cde-landing__logo {
      display: block;
      margin: 0 auto 28px;
      height: 100px;
      width: auto;
    }

    .cde-landing__divider {
      width: 48px;
      height: 2px;
      background: var(--cde-gold);
      margin: 0 auto 28px;
      border: none;
    }

    .cde-landing__icon {
      font-size: 42px;
      color: var(--cde-gold);
      font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 40;
      margin-bottom: 16px;
      display: block;
    }

    .cde-landing__title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 14px;
      letter-spacing: -0.3px;
      line-height: 1.2;
    }

    .cde-landing__text {
      font-size: 15px;
      font-weight: 400;
      color: rgba(255,255,255,0.8);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .cde-landing__link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.3px;
      padding: 10px 20px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      transition: color var(--cde-transition), border-color var(--cde-transition), background var(--cde-transition);
    }

    .cde-landing__link:hover {
      color: var(--cde-gold-light);
      border-color: var(--cde-gold);
      background: rgba(255,255,255,0.06);
    }

    .cde-landing__footer {
      margin-top: 48px;
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.3px;
    }

    .cde-landing__footer a {
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      transition: color var(--cde-transition);
    }

    .cde-landing__footer a:hover {
      color: var(--cde-gold-light);
    }

    @media (max-width: 768px) {
      .cde-landing__logo { height: 80px; }
      .cde-landing__title { font-size: 24px; }
      .cde-landing__text { font-size: 14px; }
      .cde-landing__icon { font-size: 36px; }
    }

    @media (max-width: 480px) {
      .cde-landing__logo { height: 68px; }
      .cde-landing__title { font-size: 21px; }
    }
  </style>
</head>
<body>
  <main class="cde-landing">
    <img
      class="cde-landing__logo"
      src="https://cdeldorado.gob.ar/wp-content/uploads/2026/08/Logo_Blanco.png"
      alt="Concejo Deliberante de Eldorado"
      width="1726"
      height="1014"
    >
    <hr class="cde-landing__divider">
    <span class="material-symbols-outlined cde-landing__icon">construction</span>
    <h1 class="cde-landing__title">Sitio en desarrollo</h1>
    <p class="cde-landing__text">
      La plataforma del Concejo Deliberante de Eldorado está en construcción.
      Pronto vas a poder acceder a todos los servicios.
    </p>
    <a class="cde-landing__link" href="https://cdeldorado.gob.ar">
      Ir al sitio institucional
    </a>
    <footer class="cde-landing__footer">
      © 2026 <a href="https://cdeldorado.gob.ar">Concejo Deliberante de Eldorado</a>
    </footer>
  </main>
</body>
</html>
